name: CI

# Typecheck, lint and build on every push and PR. Also packs diametral-ds and
# installs the tarball into a throwaway project, because the monorepo build
# passes even when the *published* artifact is broken — extensionless ESM
# specifiers and @source paths that climb out of the package both fail only for
# an external consumer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors publish-npm.yml, so CI tests the tarball as it will be published.
      - name: Rename to the published name
        working-directory: packages/ui
        run: npm pkg set name=diametral-ds

      - name: Pack diametral-ds
        run: pnpm --filter ./packages/ui pack --pack-destination /tmp

      - name: Assert the commercial font never ships
        run: |
          if tar tzf /tmp/diametral-ds-*.tgz | grep -iE 'ufficio|\.(woff2?|otf|ttf)$'; then
            echo "::error::A font file is present in the tarball. Ufficio is commercial and must never be distributed (see packages/ui/NOTICE.md)."
            exit 1
          fi
          echo "No font binaries in the tarball."

      - name: Install the tarball as an external consumer
        run: |
          mkdir -p /tmp/consumer/src && cd /tmp/consumer
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target":"ES2022","lib":["ES2022","DOM"],"module":"ESNext",
            "moduleResolution":"bundler","jsx":"react-jsx","strict":true,"noEmit":true,
            "skipLibCheck":true }, "include":["src"] }
          JSON
          cat > src/app.tsx <<'TSX'
          import { Card, CardContent, cn } from "diametral-ds"
          import { Button } from "diametral-ds/button"
          export const App = () => (
            <Card className={cn("m-4")}>
              <CardContent>
                <Button variant="outline" tone="red">Escalate</Button>
              </CardContent>
            </Card>
          )
          TSX
          printf '@import "diametral-ds/styles.css";\n@source "./src/**/*.tsx";\n' > src/app.css
          npm install --no-audit --no-fund react@19 react-dom@19 @types/react@19 \
            @types/react-dom@19 typescript tailwindcss @tailwindcss/cli /tmp/diametral-ds-*.tgz

      - name: Consumer typechecks against the tarball
        run: cd /tmp/consumer && npx tsc --noEmit

      - name: Consumer resolves the package under plain Node ESM
        run: |
          cd /tmp/consumer
          node --input-type=module -e "
            Promise.all([import('diametral-ds'), import('diametral-ds/button')])
              .then(() => console.log('Node ESM resolution OK'))
              .catch(e => { console.error('Node ESM resolution FAILED:', e.code); process.exit(1) })
          "

      - name: Tailwind picks up classes from inside the package
        run: |
          cd /tmp/consumer
          npx @tailwindcss/cli -i src/app.css -o out.css
          for cls in shrink-0 tabular-nums; do
            grep -q "$cls" out.css || { echo "::error::Tailwind did not emit .$cls — the packaged @source directive is broken."; exit 1; }
          done
          grep -q -- '--ds-red' out.css || { echo "::error::Brand tokens missing from consumer CSS."; exit 1; }
          echo "Packaged stylesheet is self-scanning correctly."

      # Consumers on React 18 or without Tailwind v4 use styles.compiled.css.
      - name: React 18 consumer without Tailwind builds against the tarball
        run: |
          mkdir -p /tmp/consumer18/src && cd /tmp/consumer18
          echo '{"name":"consumer18","private":true,"type":"module"}' > package.json
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target":"ES2022","lib":["ES2022","DOM"],"module":"ESNext",
            "moduleResolution":"bundler","jsx":"react-jsx","strict":true,"noEmit":true,
            "skipLibCheck":true,"types":["vite/client"] }, "include":["src"] }
          JSON
          cat > src/main.tsx <<'TSX'
          import "diametral-ds/styles.compiled.css"
          import { createRoot } from "react-dom/client"
          import { Card, CardContent, Tabs, TabsList, TabsTrigger, TabsContent, cn } from "diametral-ds"
          import { Button } from "diametral-ds/button"
          createRoot(document.getElementById("root")!).render(
            <Card className={cn("m-4")}>
              <CardContent>
                <Tabs defaultValue="a">
                  <TabsList><TabsTrigger value="a">A</TabsTrigger></TabsList>
                  <TabsContent value="a"><Button variant="outline" tone="red">Escalate</Button></TabsContent>
                </Tabs>
              </CardContent>
            </Card>
          )
          TSX
          echo '<div id="root"></div><script type="module" src="/src/main.tsx"></script>' > index.html
          npm install --no-audit --no-fund react@18 react-dom@18 react-is@18 @types/react@18 \
            @types/react-dom@18 typescript vite /tmp/diametral-ds-*.tgz
          if [ -d node_modules/tailwindcss ]; then echo "::error::tailwindcss was installed; it should be an optional peer."; exit 1; fi
          npx tsc --noEmit
          npx vite build
          grep -q -- '--ds-red' dist/assets/*.css || { echo "::error::Brand tokens missing from the compiled CSS bundle."; exit 1; }
          ls dist/assets/*.woff2 >/dev/null || { echo "::error::Geist fonts did not resolve from the compiled CSS."; exit 1; }
          echo "React 18 consumer without Tailwind builds."
