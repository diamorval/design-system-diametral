# GitHub only auto-closes "Closes #N" issues when a PR merges into the
# default branch. Sandcastle PRs target the branch the run was launched from
# (e.g. feat/sandcastle), so this workflow replicates the auto-close for them.
name: sandcastle-close-issues

on:
  pull_request:
    types: [closed]

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'sandcastle/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues referenced by closing keywords in the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "$BODY" |
            grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' |
            grep -oE '[0-9]+' |
            sort -u |
            while read -r n; do
              # `|| true`: already-closed issues (e.g. base was the default
              # branch and GitHub closed it natively) must not fail the job.
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "Completed by Sandcastle — merged in #$PR" || true
            done
