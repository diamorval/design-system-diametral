name: Publish diametral-ds to npm

# MANUAL ONLY, ON PURPOSE. There is no tag or release trigger: publishing has not
# been authorised yet, so this workflow exists to be ready, not to fire. Add a
# `push: tags: ["v*"]` trigger when that changes.
#
# Requires an NPM_TOKEN secret (a granular npm token with publish rights on
# diametral-ds).
#
# In-repo the package is @diametral/ui; it is published as diametral-ds (personal
# npm account, while the @diametral scope is not available to us). The rename is
# one step below — delete it to publish under the in-repo name. Filters use the
# package path, not its name, because the name changes mid-job.
#
# Note the guards below. The tarball must never contain a font binary: Ufficio is
# commercial and its licence requires offline-only storage (see
# packages/ui/NOTICE.md). And the package is verified from the outside — installed
# into a throwaway project — because the monorepo build passes even when the
# published artifact does not resolve.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

# Serialize, don't cancel: a second dispatch shouldn't race an in-flight
# `npm publish` or interrupt one mid-way and leave a half-published version.
concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Rename to the published name
        working-directory: packages/ui
        run: npm pkg set name=diametral-ds

      - name: Pack
        run: pnpm --filter ./packages/ui pack --pack-destination /tmp

      - name: Assert no font binary ships
        run: |
          if tar tzf /tmp/diametral-ds-*.tgz | grep -iE 'ufficio|\.(woff2?|otf|ttf)$'; then
            echo "::error::A font file is present in the tarball. Ufficio is commercial and must never be distributed."
            exit 1
          fi
          echo "No font binaries in the tarball."

      - name: Verify the tarball resolves under plain Node ESM
        run: |
          mkdir -p /tmp/verify && cd /tmp/verify
          echo '{"name":"verify","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund react@19 react-dom@19 /tmp/diametral-ds-*.tgz
          node --input-type=module -e "
            const root = await import('diametral-ds')
            const sub = await import('diametral-ds/button')
            if (root.Button !== sub.Button || typeof root.cn !== 'function') throw new Error('root/subpath mismatch')
            import.meta.resolve('diametral-ds/styles.css')
            import.meta.resolve('diametral-ds/assets/diametral-mark.svg')
            console.log('resolution OK:', Object.keys(root).length, 'root exports')
          "

      - name: Publish (public, with provenance)
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter ./packages/ui publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run — packed and verified, nothing published. Re-run with dry_run=false to publish."
