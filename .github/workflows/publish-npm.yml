name: Publish @diametral/ui to npm

# MANUAL ONLY, ON PURPOSE. There is no tag or release trigger: publishing has not
# been authorised yet, so this workflow exists to be ready, not to fire. Add a
# `push: tags: ["v*"]` trigger when that changes.
#
# Requires an NPM_TOKEN secret (an npm automation token for an account that owns
# the @diametral scope).
#
# Note the guards below. The tarball must never contain a font binary: Ufficio is
# commercial and its licence requires offline-only storage (see
# packages/ui/NOTICE.md). And the package is verified from the outside — installed
# into a throwaway project — because the monorepo build passes even when the
# published artifact does not resolve.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: "@diametral"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm --filter @diametral/ui run build

      - name: Pack
        run: pnpm --filter @diametral/ui pack --pack-destination /tmp

      - name: Assert no font binary ships
        run: |
          if tar tzf /tmp/diametral-ui-*.tgz | grep -iE 'ufficio|\.(woff2?|otf|ttf)$'; then
            echo "::error::A font file is present in the tarball. Ufficio is commercial and must never be distributed."
            exit 1
          fi
          echo "No font binaries in the tarball."

      - name: Verify the tarball resolves under plain Node ESM
        run: |
          mkdir -p /tmp/verify && cd /tmp/verify
          echo '{"name":"verify","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund react@19 react-dom@19 /tmp/diametral-ui-*.tgz
          node --input-type=module -e "
            import('@diametral/ui/components/button')
              .then(() => console.log('resolution OK'))
              .catch(e => { console.error('resolution FAILED:', e.code); process.exit(1) })
          "

      - name: Publish (public, with provenance)
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @diametral/ui publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run — packed and verified, nothing published. Re-run with dry_run=false to publish."
